[project]
name = "churn"
version = "0.1.0"
description = "Player churn prediction from first-day mobile-game event data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8", "jupyterlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]
